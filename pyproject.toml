[project]
name = "agentic-rag"
version = "0.1.0"
description = "Multi-hop RAG agent: decomposition, per-hop extraction, self-critique"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Retrieval is reused from the sec-rag project rather than reimplemented.
    # The agent only needs an object exposing .text / .chunk_id / .citation().
    "sec-rag",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
sec-rag = { path = "../sec-rag", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
